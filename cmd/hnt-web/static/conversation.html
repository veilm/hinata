<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Conversation</title>
		<!-- Title will be updated by JS -->
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❄️</text></svg>"
		>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
			rel="stylesheet"
		>
		<link rel="stylesheet" href="/css/style.css">
	</head>
	<body>
		<div class="container">
			<div class="header-with-user">
				<a href="/" class="back-link">&larr; Back to Conversations List</a>
				<div class="user-info">
					<span id="username-display"></span>
					<button type="button" id="logout-btn" class="logout-btn">
						Logout
					</button>
				</div>
			</div>
			<div class="title-section">
				<div class="title-header">
					<h1 id="conversation-id-display">Loading conversation...</h1>
					<button
						type="button"
						id="settings-toggle-btn"
						class="settings-toggle-btn"
						title="Settings"
					>
						<svg
							xmlns="http://www.w3.org/2000/svg"
							width="24"
							height="24"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							class="lucide lucide-menu-icon lucide-menu"
						>
							<path d="M4 12h16"/>
							<path d="M4 18h16"/>
							<path d="M4 6h16"/>
						</svg>
					</button>
				</div>
			</div>

			<!-- Settings Modal -->
			<div id="settings-modal" class="settings-modal-overlay hidden">
				<div class="settings-modal-content">
					<button
						type="button"
						class="settings-modal-close"
						id="settings-modal-close"
					>
						&times;
					</button>
					<h2>Conversation Settings</h2>

					<div class="settings-form">
						<div class="settings-input-group">
							<label for="modal-title-input">Title</label>
							<input type="text" id="modal-title-input" class="settings-input">
						</div>

						<div class="settings-input-group">
							<label for="modal-model-input">Model</label>
							<input type="text" id="modal-model-input" class="settings-input">
						</div>

						<div class="settings-divider"></div>

						<div class="settings-actions">
							<button
								type="button"
								id="modal-pin-toggle-btn"
								class="settings-action-btn"
							>
								<span class="action-icon">
									<svg
										xmlns="http://www.w3.org/2000/svg"
										width="16"
										height="16"
										viewBox="0 0 24 24"
										fill="none"
										stroke="currentColor"
										stroke-width="2"
										stroke-linecap="round"
										stroke-linejoin="round"
										class="lucide lucide-pin-icon lucide-pin"
									>
										<path d="M12 17v5"/>
										<path
											d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"
										/>
									</svg>
								</span>
								<span id="modal-pin-text">Pin Conversation</span>
							</button>

							<button
								type="button"
								id="modal-fork-btn"
								class="settings-action-btn"
							>
								<span class="action-icon">
									<svg
										xmlns="http://www.w3.org/2000/svg"
										width="16"
										height="16"
										viewBox="0 0 24 24"
										fill="none"
										stroke="currentColor"
										stroke-width="2"
										stroke-linecap="round"
										stroke-linejoin="round"
										class="lucide lucide-split-icon lucide-split"
									>
										<path d="M16 3h5v5"/>
										<path d="M8 3H3v5"/>
										<path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/>
										<path d="m15 9 6-6"/>
									</svg>
								</span>
								<span>Fork Conversation</span>
							</button>

							<button
								type="button"
								id="modal-share-btn"
								class="settings-action-btn"
							>
								<span class="action-icon">
									<svg
										xmlns="http://www.w3.org/2000/svg"
										width="16"
										height="16"
										viewBox="0 0 24 24"
										fill="none"
										stroke="currentColor"
										stroke-width="2"
										stroke-linecap="round"
										stroke-linejoin="round"
										class="lucide lucide-users-icon lucide-users"
									>
										<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
										<path d="M16 3.128a4 4 0 0 1 0 7.744"/>
										<path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
										<circle cx="9" cy="7" r="4"/>
									</svg>
								</span>
								<span>Share Conversation</span>
							</button>
						</div>
					</div>
				</div>
			</div>

			<div id="messages-container">
				<!-- Messages will be rendered here by JavaScript -->
			</div>

			<div id="other-files-container">
				<!-- Other files will be rendered here by JavaScript -->
			</div>
		</div>
		<script type="module" src="/js/main.js"></script>
	</body>
</html>
